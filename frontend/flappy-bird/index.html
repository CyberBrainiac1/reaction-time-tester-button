<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#77c9ee">
    <meta name="description" content="A tiny Flappy Bird-style game for the giant button">
    <title>Flappy Bird · Giant Button Lab</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main>
      <a class="back" href="../">← Back to Giant Button Lab</a>
      <header>
        <p>GIANT BUTTON LAB</p>
        <h1>Flappy Bird</h1>
        <span id="connection">KEYBOARD / CLICK</span>
      </header>
      <section class="game-shell" aria-label="Flappy Bird game">
        <canvas id="game" width="420" height="620" aria-label="Press Space, click, or use the giant button to flap"></canvas>
        <div class="controls">
          <button id="connect">Connect giant button</button>
          <button id="restart">Restart</button>
        </div>
        <p>Press <b>Space</b>, click/tap the game, or press the giant button to flap.</p>
      </section>
      <footer>Flappy Bird-style game adapted from the open-source <a href="https://github.com/nebez/floppybird">Floppy Bird</a> project.</footer>
    </main>
    <script src="game.js"></script>
  </body>
</html>
